<!DOCTYPE html>
<html>
<head>
<title>Secret Mission</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

<h1>🎮 SECRET MISSION</h1>

<div id="progress">
Миссия: <span id="percent">0</span>%
<div class="bar">
<div id="barFill"></div>
</div>
</div>


<div id="start">

<h2>Тебе предстоит пройти секретную миссию...</h2>

<p>
Восстанови воспоминания и найди финальную точку.
</p>

<button onclick="startGame()">
НАЧАТЬ
</button>

</div>


<div id="timer" class="hidden">

<h2>⏳ Обратный отсчёт</h2>

<h1 id="countdown"></h1>

<button onclick="nextMission()">
ПРОДОЛЖИТЬ
</button>

</div>


<div id="mission1" class="hidden">

<h2>🧩 МИССИЯ 1</h2>

<p>
На каком фото изображены люди,
которые закрыли ипотеку?
</p>


<div class="photos">

<button onclick="checkAnswer(1)">
📸 Фото 1
</button>

<button onclick="checkAnswer(2)">
📸 Фото 2
</button>

<button onclick="checkAnswer(3)">
📸 Фото 3
</button>

</div>

</div>


<div id="result" class="hidden">

<h2 id="resultText"></h2>

<button onclick="nextMission()">
ДАЛЬШЕ
</button>

</div>


</div>


<script src="script.js"></script>

</body>
</html>
